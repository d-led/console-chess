name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Stockfish (for the engine integration test)
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - run: ./gradlew test

  create-release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi

  build:
    name: Build native (${{ matrix.os-name }}/${{ matrix.arch }})
    needs: [test, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macos
            arch: arm64
            binary: build/native/nativeCompile/console-chess
          - os: macos-15-intel
            os-name: macos
            arch: x64
            binary: build/native/nativeCompile/console-chess
          - os: ubuntu-latest
            os-name: linux
            arch: x64
            binary: build/native/nativeCompile/console-chess
          - os: ubuntu-24.04-arm
            os-name: linux
            arch: arm64
            binary: build/native/nativeCompile/console-chess
          - os: windows-latest
            os-name: windows
            arch: x64
            binary: build/native/nativeCompile/console-chess.exe
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Gradle 8.14 can't run its daemon on Java 25. Use JDK 21 for the daemon
      # and compilation; GRAALVM_HOME (set above) stays GraalVM 25 for native-image.
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile native image
        shell: bash
        run: ./gradlew nativeCompile -Pversion=${GITHUB_REF_NAME#v}

      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          os="${{ matrix.os-name }}"
          arch="${{ matrix.arch }}"
          dir="dist/pkg/console-chess-${version}-${os}-${arch}"
          mkdir -p "${dir}"
          cp "${{ matrix.binary }}" "${dir}/console-chess"
          chmod +x "${dir}/console-chess"
          if [[ "$os" == "windows" ]]; then
            # zip with the exe at the root so chocolatey extracts it directly
            archive="dist/console-chess-${version}-${os}-${arch}.zip"
            (cd "${dir}" && tar -acf "../$(basename "${archive}")" console-chess)
          else
            archive="dist/console-chess-${version}-${os}-${arch}.tar.gz"
            tar -czf "${archive}" -C dist/pkg "console-chess-${version}-${os}-${arch}"
          fi
          sha256sum "${archive}" | awk '{print $1}' > dist/checksum.txt

      - name: Upload archive to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          os="${{ matrix.os-name }}"
          arch="${{ matrix.arch }}"
          if [[ "$os" == "windows" ]]; then ext=".zip"; else ext=".tar.gz"; fi
          gh release upload "${GITHUB_REF_NAME}" "dist/console-chess-${version}-${os}-${arch}${ext}" --clobber

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: checksum-${{ matrix.os-name }}-${{ matrix.arch }}
          path: dist/checksum.txt
          if-no-files-found: error

  publish-tap:
    name: Publish formula to tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download checksums
        uses: actions/download-artifact@v8
        with:
          path: dist/checksums

      - name: Generate formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha_macos_arm64="$(cat dist/checksums/checksum-macos-arm64/checksum.txt)"
          sha_macos_x64="$(cat dist/checksums/checksum-macos-x64/checksum.txt)"
          sha_linux_x64="$(cat dist/checksums/checksum-linux-x64/checksum.txt)"
          sha_linux_arm64="$(cat dist/checksums/checksum-linux-arm64/checksum.txt)"

          VERSION="${version}" \
          SHA_MACOS_ARM64="${sha_macos_arm64}" \
          SHA_MACOS_X64="${sha_macos_x64}" \
          SHA_LINUX_X64="${sha_linux_x64}" \
          SHA_LINUX_ARM64="${sha_linux_arm64}" \
          bash scripts/generate-homebrew-formula.sh > dist/console-chess.rb

      - name: Update Homebrew tap
        env:
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISHER_TOKEN}@github.com/d-led/homebrew-d-led.git" dist/tap
          cp dist/console-chess.rb dist/tap/console-chess.rb
          git -C dist/tap config user.name "Dmitry Ledentsov"
          git -C dist/tap config user.email "dmlled@yahoo.com"
          git -C dist/tap add console-chess.rb
          if git -C dist/tap diff --cached --quiet; then
            echo "Formula is up to date; nothing to push"
          else
            git -C dist/tap commit -m "console-chess ${version}"
            git -C dist/tap push
          fi

  publish-choco:
    name: Publish Chocolatey package
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Windows checksum
        uses: actions/download-artifact@v8
        with:
          name: checksum-windows-x64
          path: dist/checksums

      - name: Create and push Chocolatey package
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256="$(cat dist/checksums/checksum.txt)"
          url="https://github.com/d-led/console-chess/releases/download/${GITHUB_REF_NAME}/console-chess-${version}-windows-x64.zip"

          VERSION="${version}" URL="${url}" SHA256="${sha256}" \
            bash scripts/generate-chocolatey-package.sh

          choco push "dist/choco/console-chess.${version}.nupkg" \
            --source https://push.chocolatey.org/ --api-key "${CHOCOLATEY_API_KEY}"
