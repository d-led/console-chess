name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Stockfish (for the engine integration test)
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - run: ./gradlew test

  build:
    name: Build native (${{ matrix.os-name }}/${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            os-name: macos
            arch: arm64
          - os: macos-13
            os-name: macos
            arch: x64
          - os: ubuntu-latest
            os-name: linux
            arch: x64
          - os: ubuntu-24.04-arm
            os-name: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile native image
        run: ./gradlew nativeCompile

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: chess-${{ matrix.os-name }}-${{ matrix.arch }}
          path: build/native/nativeCompile/chess
          if-no-files-found: error

  release:
    name: Publish release and update tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/binaries

      - name: Package archives and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/out dist/pkg

          package() {
            local os="$1" arch="$2"
            local dir="dist/pkg/chess-${version}-${os}-${arch}"
            mkdir -p "${dir}"
            cp "dist/binaries/chess-${os}-${arch}/chess" "${dir}/chess"
            chmod +x "${dir}/chess"
            tar -czf "dist/out/chess-${version}-${os}-${arch}.tar.gz" -C dist/pkg "chess-${version}-${os}-${arch}"
          }

          package macos arm64
          package macos x64
          package linux x64
          package linux arm64

          (cd dist/out && sha256sum ./*.tar.gz) > dist/checksums.txt

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha_macos_arm64="$(awk '$2 ~ /macos-arm64/ {print $1}' dist/checksums.txt)"
          sha_macos_x64="$(awk '$2 ~ /macos-x64/ {print $1}' dist/checksums.txt)"
          sha_linux_arm64="$(awk '$2 ~ /linux-arm64/ {print $1}' dist/checksums.txt)"
          sha_linux_x64="$(awk '$2 ~ /linux-x64/ {print $1}' dist/checksums.txt)"

          VERSION="${version}" \
          SHA_MACOS_ARM64="${sha_macos_arm64}" \
          SHA_MACOS_X64="${sha_macos_x64}" \
          SHA_LINUX_ARM64="${sha_linux_arm64}" \
          SHA_LINUX_X64="${sha_linux_x64}" \
          bash scripts/generate-homebrew-formula.sh > dist/chess.rb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/out/*.tar.gz
            dist/checksums.txt

      - name: Update Homebrew tap
        env:
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${PUBLISHER_TOKEN}@github.com/d-led/homebrew-d-led.git" dist/tap
          cp dist/chess.rb dist/tap/chess.rb
          git -C dist/tap config user.name "Dmitry Ledentsov"
          git -C dist/tap config user.email "dmlled@yahoo.com"
          git -C dist/tap add chess.rb
          if git -C dist/tap diff --cached --quiet; then
            echo "Formula is up to date; nothing to push"
          else
            git -C dist/tap commit -m "chess ${version}"
            git -C dist/tap push
          fi
