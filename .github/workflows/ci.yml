name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Stockfish (for the engine integration test)
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - run: ./gradlew test

      - uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: JUnit Tests
          path: build/test-results/test/TEST-*.xml
          reporter: java-junit

  native:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: console-chess-linux
            binary: build/native/nativeCompile/console-chess
          - os: macos-latest
            artifact: console-chess-macos-arm64
            binary: build/native/nativeCompile/console-chess
          - os: windows-latest
            artifact: console-chess-windows
            binary: build/native/nativeCompile/console-chess.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Gradle 8.14 can't run its daemon on Java 25. Use JDK 21 for the daemon
      # and compilation; GRAALVM_HOME (set above) stays GraalVM 25 for native-image.
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile icon resource (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: docs/img
        run: |
          $rc = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe" -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $rc /nologo /fo console-chess.res console-chess.rc

      - run: ./gradlew nativeCompile

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
